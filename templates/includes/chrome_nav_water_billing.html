      <button class="tab-button" type="button" role="tab" title="Readings &amp; Billing" aria-selected="{% if active_tab == 'readingsBillingTab' %}true{% else %}false{% endif %}" data-tab-target="readingsBillingTab"><span class="tab-icon">📋</span><span class="tab-label">Readings &amp; Billing</span></button>
      <button class="tab-button" type="button" role="tab" title="Payments" aria-selected="{% if active_tab == 'paymentsTab' %}true{% else %}false{% endif %}" data-tab-target="paymentsTab"><span class="tab-icon">💵</span><span class="tab-label">Payments</span></button>
      <button class="tab-button" type="button" role="tab" title="Receivables" aria-selected="{% if active_tab == 'arTab' %}true{% else %}false{% endif %}" data-tab-target="arTab"><span class="tab-icon">📈</span><span class="tab-label">Receivables</span></button>

    <div class="sidebar-stats">
      <div class="stat-row"><span>Customers</span><strong>{{ stats.total_customers }}</strong></div>
