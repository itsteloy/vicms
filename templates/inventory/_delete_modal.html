{% load static %}
<div id="deleteModal" class="modal-overlay"
    style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;">
    <div
      style="background:#fff;border-radius:12px;padding:30px 24px;max-width:400px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
      <h3 style="margin-top:0;font-size:1.2rem;">Confirm Deletion</h3>
      <p style="color:#475467;margin-bottom:16px;">Please enter your password to delete this item.</p>
      <div style="position:relative;">
        <input type="password" id="deletePassword" placeholder="Enter password"
          style="width:100%;padding:10px 40px 10px 14px;border:1px solid #d0d5dd;border-radius:8px;font-size:0.95rem;margin-bottom:12px;box-sizing:border-box;">
        <button type="button" id="togglePassword" class="password-toggle"
          data-show-src="{% static 'show.png' %}"
          data-hide-src="{% static 'hidden.png' %}"
          aria-label="Show password">
          <img src="{% static 'hidden.png' %}" alt="" class="password-toggle-icon" width="20" height="20">
        </button>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button id="deleteCancelBtn"
          style="padding:8px 16px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;cursor:pointer;">Cancel</button>
        <button type="button" id="deleteConfirmBtn"
          style="padding:8px 16px;border:none;border-radius:8px;background:#b42318;color:#fff;cursor:pointer;">Delete</button>
      </div>
      <div id="deleteError" style="color:#b42318;margin-top:8px;font-size:0.9rem;display:none;"></div>
    </div>
  </div>
