<!-- top bar -->
    <header class="topbar">
      <div class="topbar-leading">
        <button type="button" class="mobile-nav-toggle" id="mobileNavToggle" aria-controls="inventorySidebar" aria-expanded="false" title="Open menu">
          <span class="mobile-nav-bars" aria-hidden="true"></span>
          <span class="sr-only">Open menu</span>
        </button>
        <div class="greeting">
          <h2>Inventory Dashboard</h2>
          <p>Track products, stock, categories, and item images.</p>
        </div>
      </div>
      <div class="top-actions">
        <a href="{% url 'logout' %}">🚪 Logout</a>
      </div>
    </header>

    <!-- stats -->
    <div class="hero-stats">
      <div class="stat-card">
        <div class="stat-label">Total Items</div>
        <div class="stat-value">{{ inventory_items|length }}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Units</div>
        <div class="stat-value">{{ total_stock|default:0 }}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Low Stock</div>
        <div class="stat-value">{{ low_stock_count|default:0 }}</div>
      </div>
    </div>
