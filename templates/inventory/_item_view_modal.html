<div id="itemViewModal" class="modal-overlay item-view-overlay">
  <div class="item-view-card" role="dialog" aria-modal="true" aria-labelledby="itemViewTitle">
    <div class="item-view-media" id="itemViewPicture">No image</div>
    <div class="item-view-body">
      <p class="item-view-code" id="itemViewCode"></p>
      <h3 id="itemViewTitle"></h3>
      <p class="item-view-category" id="itemViewCategory"></p>
      <p class="item-view-stock">Stocks available: <strong id="itemViewStock"></strong></p>
      <div class="item-view-block">
        <h4>Description</h4>
        <p id="itemViewDescription"></p>
      </div>
      <div class="item-view-block" id="itemViewNotesWrap">
        <h4>Notes</h4>
        <p id="itemViewNotes"></p>
      </div>
      <div class="item-view-actions">
        <button type="button" class="copy" id="itemViewCloseBtn">Close</button>
      </div>
    </div>
  </div>
</div>
