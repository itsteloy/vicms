{% load static %}
<!-- SIDEBAR -->
<aside class="sidebar" role="navigation" aria-label="Inventory dashboard navigation">
    <div class="sidebar-brand">
      <div class="logo">
        <img src="{% static 'viclogo_white.png' %}" alt="VERSATEC logo" class="logo-icon"
          style="width:38px;height:38px;object-fit:contain;border-radius:10px;">
        <span class="logo-text">VERSATEC <small>Management System</small></span>
      </div>
    </div>

    <nav class="sidebar-nav" aria-label="Inventory sections">
      <div class="nav-label">Inventory</div>
      <button class="tab-button" type="button" role="tab" aria-selected="true" data-tab-target="managePanel">
        <span class="tab-icon">📦</span>
        Manage Item
        <span class="tab-badge">{{ inventory_items|length }}</span>
      </button>
      <button class="tab-button" type="button" role="tab" aria-selected="false" data-tab-target="allItemsPanel">
        <span class="tab-icon">📋</span>
        All Items
      </button>

      <div class="nav-label" style="margin-top:14px;">Documents</div>
      <button class="tab-button" type="button" role="tab" aria-selected="false" data-tab-target="purchaseOrderPanel">
        <span class="tab-icon">🧾</span>
        Purchase Order
      </button>
    </nav>

    <div class="sidebar-stats">
      <div class="stat-row">
        <span>Total items</span>
        <strong>{{ inventory_items|length }}</strong>
      </div>
      <div class="stat-row">
        <span>Total stock</span>
        <strong>{{ total_stock|default:0 }}</strong>
      </div>
      <div class="stat-row">
        <span>Low stock (< 10)</span>
            <strong>{{ low_stock_count|default:0 }}</strong>
      </div>
    </div>
  </aside>
