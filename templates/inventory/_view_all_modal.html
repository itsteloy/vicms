<div id="viewAllModal" class="modal-overlay view-all-overlay" aria-hidden="true">
  <div class="view-all-panel" role="dialog" aria-modal="true" aria-labelledby="viewAllTitle">
    <header class="view-all-header">
      <div>
        <h2 id="viewAllTitle">Browse inventory</h2>
        <p class="view-all-subtitle" id="viewAllSubtitle">Products grouped by category</p>
      </div>
      <button type="button" class="toolbar-control" id="viewAllCloseBtn">Close</button>
    </header>
    <div class="view-all-body" id="viewAllCatalog">
      <div class="view-all-empty" id="viewAllEmpty" hidden>
        <strong>No matching items.</strong>
        <p>Try clearing filters or searching a different term.</p>
      </div>
    </div>
  </div>
</div>
